[project]
name = "dupfinder"
version = "1.0.0"
description = "Find and clean up duplicate files, with JSON and HTML reports"
readme = "README.md"
authors = [{ name = "Jean-François" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dupfinder = "dupfinder.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
